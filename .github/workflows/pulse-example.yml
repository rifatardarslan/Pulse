name: Pulse Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # Weekly on Monday at 02:00 UTC

jobs:
  security-scan:
    name: Pulse Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed for PR comment step

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pulse Security Scan
        id: pulse
        uses: ./.github/actions/pulse-scan
        with:
          api_url: ${{ secrets.PULSE_API_URL }}
          api_key: ${{ secrets.PULSE_API_KEY }}
          fail_on_critical: 'true'
          export_report: 'true'
          poll_timeout: '600'

      - name: Post scan summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Pulse Security Scan

            | Metric | Value |
            |--------|-------|
            | Total Findings | ${{ steps.pulse.outputs.vuln_count }} |
            | Critical (excl. FP) | ${{ steps.pulse.outputs.critical_count }} |
            | Scan ID | \`${{ steps.pulse.outputs.scan_id }}\` |

            > Full report attached as build artifact.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
