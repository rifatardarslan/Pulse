services:
  db:
    image: postgres:16-alpine
    container_name: pulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse123}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    networks:
      - pulse_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pulse_redis
    restart: always
    command: redis-server --loglevel warning
    networks:
      - pulse_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pulse_app
    restart: always
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 600
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pulse_internal
      - pulse_external

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pulse_worker
    restart: always
    command: celery -A app.tasks.worker.celery_app worker --loglevel=info -c 4 -Q scans -n worker-scans@%h --purge
    env_file:
      - .env
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/pulse_workspaces:/tmp/pulse_workspaces
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pulse_internal
      - pulse_external

  worker-ai:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pulse_worker_ai
    restart: always
    command: celery -A app.tasks.worker.celery_app worker --loglevel=info -c 4 -Q ai -n worker-ai@%h --purge
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pulse_internal
      - pulse_external

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pulse_beat
    restart: always
    command: celery -A app.tasks.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
      - celerybeat_data:/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulse_internal

volumes:
  pulse_pgdata:
  celerybeat_data:

networks:
  pulse_internal:
    internal: true
  pulse_external:
